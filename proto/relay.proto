}

message UseInviteRequest     { string code = 1; int64 user_id = 2; }
message UseInviteResponse    { int64 guild_id = 1; int64 channel_id = 2; }

// ──────────────────────────────────────────────────────────────────────────────
// BanService
// ──────────────────────────────────────────────────────────────────────────────

service BanService {
  rpc GetBan(GetBanRequest)       returns (Ban);
  rpc GetBans(GetBansRequest)     returns (GetBansResponse);
  rpc CreateBan(CreateBanRequest) returns (Ban);
  rpc DeleteBan(DeleteBanRequest) returns (Empty);
}

message GetBanRequest    { int64 guild_id = 1; int64 user_id = 2; }
message GetBansRequest   { int64 guild_id = 1; int32 limit = 2; optional int64 before = 3; optional int64 after = 4; }
message GetBansResponse  { repeated Ban bans = 1; }
message DeleteBanRequest { int64 guild_id = 1; int64 user_id = 2; }

message CreateBanRequest {
  int64  guild_id         = 1;
  int64  user_id          = 2;
  optional string reason  = 3;
  int32  delete_message_days = 4;
}

// ──────────────────────────────────────────────────────────────────────────────
// RelationshipService
// ──────────────────────────────────────────────────────────────────────────────

service RelationshipService {
  rpc GetRelationships(GetRelationshipsRequest)   returns (GetRelationshipsResponse);
  rpc GetRelationship(GetRelationshipRequest)     returns (Relationship);
  rpc UpsertRelationship(UpsertRelationshipRequest) returns (Relationship);
  rpc DeleteRelationship(DeleteRelationshipRequest) returns (Empty);
  rpc GetMutualFriends(GetMutualFriendsRequest)   returns (GetRelationshipsResponse);
  rpc GetMutualGuilds(GetMutualGuildsRequest)     returns (GetMutualGuildsResponse);
  // Resolve a target user by their (case-insensitive) username so the API can
  // turn an "add friend by username" request into a relationship by user id.
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (User);
}

message GetRelationshipsRequest  { int64 user_id = 1; }
message GetUserByUsernameRequest { string username = 1; }
message GetRelationshipsResponse { repeated Relationship relationships = 1; }
message GetRelationshipRequest   { int64 user_id = 1; int64 target_id = 2; }
message DeleteRelationshipRequest { int64 user_id = 1; int64 target_id = 2; }
message GetMutualFriendsRequest  { int64 user_id = 1; int64 target_id = 2; }
message GetMutualGuildsRequest   { int64 user_id = 1; int64 target_id = 2; }
message GetMutualGuildsResponse  { repeated GuildSummary guilds = 1; }

message UpsertRelationshipRequest {
  int64 user_id   = 1;
  int64 target_id = 2;
  int32 type      = 3;
}

// ──────────────────────────────────────────────────────────────────────────────
// ReadStateService
// ──────────────────────────────────────────────────────────────────────────────

service ReadStateService {
  rpc GetReadStates(GetReadStatesRequest)   returns (GetReadStatesResponse);
  rpc GetReadState(GetReadStateRequest)     returns (ReadState);
  rpc AckMessage(AckMessageRequest)         returns (ReadState);
  rpc DeleteReadState(DeleteReadStateRequest) returns (Empty);
}

message GetReadStatesRequest  { int64 user_id = 1; }
message GetReadStatesResponse { repeated ReadState read_states = 1; }
message GetReadStateRequest   { int64 user_id = 1; int64 channel_id = 2; }
message AckMessageRequest     { int64 user_id = 1; int64 channel_id = 2; int64 message_id = 3; }
message DeleteReadStateRequest { int64 user_id = 1; int64 channel_id = 2; }

// ──────────────────────────────────────────────────────────────────────────────
// ThreadService
// ──────────────────────────────────────────────────────────────────────────────

service ThreadService {
  rpc GetThread(GetThreadRequest)             returns (Thread);
  rpc CreateThread(CreateThreadRequest)       returns (Thread);
  rpc UpdateThread(UpdateThreadRequest)       returns (Thread);
  rpc ArchiveThread(ArchiveThreadRequest)     returns (Thread);
  rpc GetChannelThreads(GetChannelThreadsRequest) returns (GetThreadsResponse);
  rpc GetGuildThreads(GetGuildThreadsRequest)     returns (GetThreadsResponse);
  rpc AddThreadMember(AddThreadMemberRequest)     returns (Empty);
  rpc RemoveThreadMember(RemoveThreadMemberRequest) returns (Empty);
  rpc GetForumPosts(GetForumPostsRequest)     returns (GetThreadsResponse);
}

message GetThreadRequest   { int64 thread_id = 1; }
message DeleteThreadRequest { int64 thread_id = 1; }
message GetChannelThreadsRequest { int64 channel_id = 1; bool archived = 2; }
message GetGuildThreadsRequest   { int64 guild_id = 1; bool archived = 2; }
message GetThreadsResponse       { repeated Thread threads = 1; }
message AddThreadMemberRequest   { int64 thread_id = 1; int64 user_id = 2; }
message RemoveThreadMemberRequest { int64 thread_id = 1; int64 user_id = 2; }
message ArchiveThreadRequest     { int64 thread_id = 1; bool locked = 2; }
message GetForumPostsRequest     { int64 channel_id = 1; string sort_order = 2; int32 limit = 3; }

message CreateThreadRequest {
  int64  channel_id    = 1;
  int64  guild_id      = 2;
  int64  owner_id      = 3;
  string name          = 4;
  int32  type          = 5;
  int32  auto_archive_duration = 6;
  optional int64 message_id = 7;
}

message UpdateThreadRequest {
  int64  thread_id     = 1;
  optional string name          = 2;
  optional bool   archived      = 3;
  optional int32  auto_archive_duration = 4;
  optional bool   locked        = 5;
  optional int32  rate_limit_per_user = 6;
}

// ──────────────────────────────────────────────────────────────────────────────
// WebhookService
// ──────────────────────────────────────────────────────────────────────────────

service WebhookService {
  rpc GetWebhook(GetWebhookRequest)               returns (Webhook);
  rpc GetChannelWebhooks(GetChannelWebhooksRequest) returns (GetWebhooksResponse);
  rpc GetGuildWebhooks(GetGuildWebhooksRequest)   returns (GetWebhooksResponse);
  rpc CreateWebhook(CreateWebhookRequest)         returns (Webhook);
  rpc UpdateWebhook(UpdateWebhookRequest)         returns (Webhook);
  rpc DeleteWebhook(DeleteWebhookRequest)         returns (Empty);
}

message GetWebhookRequest         { int64 webhook_id = 1; }
message GetChannelWebhooksRequest { int64 channel_id = 1; }
message GetGuildWebhooksRequest   { int64 guild_id   = 1; }
message GetWebhooksResponse       { repeated Webhook webhooks = 1; }
message DeleteWebhookRequest      { int64 webhook_id = 1; }

message CreateWebhookRequest {
  int64  guild_id   = 1;
  int64  channel_id = 2;
  int64  user_id    = 3;
  string name       = 4;
  optional string avatar = 5;
}

message UpdateWebhookRequest {
  int64  webhook_id  = 1;
  optional string name       = 2;
  optional string avatar     = 3;
  optional int64  channel_id = 4;
}

// ──────────────────────────────────────────────────────────────────────────────
// NotificationService
// ──────────────────────────────────────────────────────────────────────────────

service NotificationService {
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);
  rpc UpsertNotificationSettings(UpsertNotificationSettingsRequest) returns (NotificationSettings);
  rpc DeleteNotificationSettings(DeleteNotificationSettingsRequest) returns (Empty);
}

message GetNotificationSettingsRequest {
  int64 user_id = 1;
  optional int64 guild_id   = 2;
  optional int64 channel_id = 3;
}
message GetNotificationSettingsResponse { repeated NotificationSettings settings = 1; }
message DeleteNotificationSettingsRequest {
  int64 user_id  = 1;
  optional int64 guild_id   = 2;
  optional int64 channel_id = 3;
}

message UpsertNotificationSettingsRequest {
  int64 user_id    = 1;
  optional int64 guild_id   = 2;
  optional int64 channel_id = 3;
  int32 message_notifications = 4;
  bool  muted      = 5;
  bool  suppress_everyone = 6;
  bool  suppress_roles    = 7;
  bool  mobile_push       = 8;
}
