appId: com.relay.app
productName: Relay
directories:
  output: release
files:
  - dist/**/*
  - resources/**/*
extraResources:
  - resources/**/*
win:
  target: nsis
  icon: resources/icon.ico
mac:
  target: dmg
  # electron-builder generates the .icns from a 512x512+ PNG at build time, so we
  # point at the shared icon.png rather than committing a separate .icns asset.
  icon: resources/icon.png
  category: public.app-category.social-networking
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
