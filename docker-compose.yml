name: relay

x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@postgres:5432/${POSTGRES_DB:-relay}

services:
  # ─────── Infrastructure ───────

  postgres:
    image: postgres:16-alpine
    container_name: relay-postgres
    restart: unless-stopped
    environment:
      # Default dev credentials. Override POSTGRES_USER/PASSWORD/DB in .env for a real
      # deployment — DATABASE_URL (above) and the backup sidecar read the same values.
      POSTGRES_USER: "${POSTGRES_USER:-relay}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-relay}"
      POSTGRES_DB: "${POSTGRES_DB:-relay}"
      # Seed the demo accounts (owner/player1/player2) on a fresh, backup-less database.
      # Set to false for a real deployment so no shared-password accounts are created.
      RELAY_SEED_DEMO: "${RELAY_SEED_DEMO:-true}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # On first start (empty volume) init-db.sh restores ./backups/latest.dump if it
      # exists, otherwise applies schema.sql + seed.sql (see infrastructure/init-db.sh).
      - ./infrastructure/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./infrastructure/schema.sql:/relay-init/schema.sql:ro
      - ./infrastructure/seed.sql:/relay-init/seed.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Hourly database backups so accounts/servers/messages survive an image or volume
  # rebuild. Snapshots land in ./backups on the host; postgres restores the newest one
  # automatically on a fresh start. See infrastructure/backup.sh.
  backup:
    image: postgres:16-alpine
    container_name: relay-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-relay}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-relay}"
      PGDATABASE: "${POSTGRES_DB:-relay}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-3600}"   # seconds between snapshots (hourly)
      BACKUP_KEEP: "${BACKUP_KEEP:-48}"             # snapshots to retain (~2 days of hourly backups)
    volumes:
      - ./infrastructure/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: relay-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=relay-search
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: relay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # MinIO root credentials. Also used by the API (S3_ACCESS_KEY/S3_SECRET_KEY) and the
      # minio-init bucket bootstrap below, so they must all read the same values. Override
      # S3_ACCESS_KEY/S3_SECRET_KEY in .env for a real deployment.
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-minioadmin}"
    ports:
      # Loopback-only: the browser never talks to MinIO directly — uploads go through the
      # API and reads are proxied same-origin via the client's /cdn route over the internal
      # Docker network. Keeping this off 0.0.0.0 avoids exposing the S3 API (and its root
      # credentials) to the network. Matches every other backing service.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: relay-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      # Per-bucket anonymous policies: GetObject only (no ListBucket), so files are
      # fetchable by their (unguessable) key but the bucket can't be enumerated.
      - ./infrastructure/minio-policies:/policies:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      for b in relay-attachments relay-avatars relay-icons relay-emojis; do
        mc mb myminio/$$b --ignore-existing;
        mc anonymous set-json /policies/$$b.json myminio/$$b;
      done;
      echo 'Bucket setup complete (anonymous GetObject only, no ListBucket)';
      exit 0;
      "

  # ─────── Application Services ───────

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: relay-api
    restart: unless-stopped
    environment:
      <<: *common-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: relay-attachments
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      GATEWAY_URL: http://gateway:4000
      DATA_SERVICES_URL: data-services:50051
      # This dev compose runs in development mode: it accepts the dev INTERNAL_SERVICE_SECRET
      # and serves the API docs. For a real deployment set ENVIRONMENT=production (the app then
      # hides the docs and REFUSES /internal calls until INTERNAL_SERVICE_SECRET is a strong
      # non-default value — see docs/DEPLOYMENT.md).
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      # Shared secret for internal service-to-service calls (gateway -> API voice-join
      # authorization). Must match the gateway's INTERNAL_SERVICE_SECRET. Change it in .env
      # for any real deployment.
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-relay-internal-dev-secret}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,https://localhost:5173,http://localhost:3000}"
      PORT: "8000"
      LOG_LEVEL: debug
      # Public origin used to build links in emails (verification, password reset).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:5173}"
      # Transactional email (SMTP). All left empty/unset by default -- with no
      # SMTP_HOST, the email service no-ops and just logs the verify/reset URL,
      # so the out-of-the-box dev experience is unchanged.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Relay <no-reply@relay.local>}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      SMTP_LOGIN_NOTIFICATIONS: "${SMTP_LOGIN_NOTIFICATIONS:-false}"
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v10/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: relay-gateway
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      API_URL: http://api:8000
      # Shared secret for the gateway's voice-join authorization call to the API. Must match
      # the API's INTERNAL_SERVICE_SECRET. Change it in .env for any real deployment.
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-relay-internal-dev-secret}"
      PORT: "4000"
      # LAN-reachable voice-server endpoint advertised to clients (host LAN IP:signaling port). Override in .env.
      VOICE_PUBLIC_ENDPOINT: "${VOICE_PUBLIC_ENDPOINT:-127.0.0.1:4001}"
      MIX_ENV: dev
    ports:
      - "4000:4000"
    volumes:
      - ./services/gateway:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-services:
    build:
      context: ./services/data-services
      dockerfile: Dockerfile.dev
    container_name: relay-data-services
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@postgres:5432/${POSTGRES_DB:-relay}
      REDIS_URL: redis://redis:6379/0
      GRPC_PORT: "50051"
      RUST_LOG: info
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./services/data-services:/app
      - ./proto:/proto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 http://127.0.0.1:50051 > /dev/null 2>&1; [ $? -ne 7 ]"]
      interval: 10s
      timeout: 5s
      retries: 5

  voice-server:
    build:
      context: ./services/voice-server
      dockerfile: Dockerfile
    container_name: relay-voice-server
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "4001"
      MEDIASOUP_MIN_PORT: "40000"
      MEDIASOUP_MAX_PORT: "40100"
      MEDIASOUP_LISTEN_IP: "0.0.0.0"
      # ANNOUNCED_IP is optional. Leave empty to AUTO-DETECT the host's LAN IP(s)
      # (works out-of-the-box on Linux / native / bare-metal). On Docker Desktop
      # (Windows/Mac) the container can't see the machine's physical LAN IP, so set
      # ANNOUNCED_IP=<your-host-ip> in the .env file (already prefilled for this host).
      ANNOUNCED_IP: "${ANNOUNCED_IP:-}"
    ports:
      - "4001:4001"
      # WebRTC media. mediasoup advertises both UDP and TCP ICE candidates on this range;
      # publish BOTH so ICE can fall back to TCP when UDP can't traverse (common with Docker
      # Desktop's UDP port-forwarding on Windows/macOS, or a firewall that drops UDP). Without
      # the TCP mapping, a client that can't get UDP through gets no media at all (blank video,
      # no audio) even though signaling/presence work over the separate WebSocket path.
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    volumes:
      - ./services/voice-server:/app
      - voice_server_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: relay-client
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v10
      VITE_PROXY_API_URL: http://api:8000
      # Left empty so the client derives these from window.location (reachable over LAN, not just localhost).
      # Set an explicit URL here only if you want to override the auto-derived host.
      VITE_GATEWAY_URL: ""
      VITE_PROXY_GATEWAY_URL: http://gateway:4000
      # Voice (mediasoup SFU) signaling is proxied through the client origin at /voice so
      # it shares the page's TLS on HTTPS deployments (the voice-server speaks plain ws).
      VITE_PROXY_VOICE_URL: http://voice-server:4001
      # Object-storage reads are proxied same-origin via /cdn so attachment links work over
      # HTTPS and for remote viewers (MinIO speaks plain HTTP on :9000).
      VITE_PROXY_CDN_URL: http://minio:9000
      VITE_CDN_URL: ""
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
      # Poll the filesystem for changes. Docker bind mounts on Windows/macOS hosts
      # don't forward inotify events into the container, so without this Vite never
      # sees your edits and serves stale code until the container is restarted.
      CHOKIDAR_USEPOLLING: "true"
      # GIPHY API key for the GIF picker. Free key at developers.giphy.com; set VITE_GIPHY_API_KEY.
      VITE_GIPHY_API_KEY: ${VITE_GIPHY_API_KEY:-}
      # HTTPS for the Vite dev server. Defaults to true so the zero-config quickstart
      # matches what the README, Relay.bat and the desktop app all expect: the client
      # is reachable at https://localhost:5173 (self-signed cert -> a one-time "proceed
      # anyway"), which also gives phones on the LAN a secure context so they can be
      # prompted for microphone/camera access. Set VITE_HTTPS=false in .env for plain
      # HTTP (e.g. for E2E runs or when a reverse proxy terminates TLS upstream).
      VITE_HTTPS: "${VITE_HTTPS:-true}"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
    working_dir: /app/packages/client
    depends_on:
      - api
      - gateway

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
  client_node_modules:
  voice_server_node_modules:
